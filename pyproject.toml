[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generation, validation, solving and serialization"
authors = [
    {name = "memalli"},
    {name = "alpturan"},
]
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
readme = "mazegen/README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "flake8>=7.3,<8",
    "mypy>=1.15,<3",
]


[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mazegen"
module-root = ""
include = ["mazegen/py.typed", "mazegen/README.md"]

[tool.mypy]
exclude = ["(^|/)(\\.venv|build|dist|\\.local-tests)/"]
